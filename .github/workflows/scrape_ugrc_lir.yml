name: Scrape UGRC LIR parcels (Phase 13b-2)

on:
  workflow_dispatch:
    inputs:
      county:
        description: "County to scrape (tooele|salt_lake|utah|davis|weber|wasatch|box_elder|all)"
        required: false
        default: "all"
      dry_run:
        description: "Dry run (probe endpoint + count only, no write)"
        required: false
        default: "false"

permissions:
  contents: write

jobs:
  scrape:
    name: "Scrape ${{ matrix.county }}"
    strategy:
      fail-fast: false
      matrix:
        county: [tooele, salt_lake, utah, davis, weber, wasatch, box_elder]
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Check county filter
        id: filter
        run: |
          INPUT="${{ github.event.inputs.county }}"
          COUNTY="${{ matrix.county }}"
          if [ "$INPUT" = "all" ] || [ "$INPUT" = "$COUNTY" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Skipping $COUNTY (input county: $INPUT)"
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.filter.outputs.run == 'true'

      - name: Set up Python
        if: steps.filter.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        if: steps.filter.outputs.run == 'true'
        run: pip install -r requirements.txt

      - name: Scrape ${{ matrix.county }}
        if: steps.filter.outputs.run == 'true'
        id: scrape
        run: |
          ARGS="--county ${{ matrix.county }}"
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          python scripts/scrape_ugrc_lir.py $ARGS
          if [ "${{ github.event.inputs.dry_run }}" != "true" ]; then
            CSV_FILE="data/raw/parcels_${{ matrix.county }}.csv"
            if [ -f "$CSV_FILE" ]; then
              ROW_COUNT=$(( $(wc -l < "$CSV_FILE") - 1 ))
              echo "row_count=$ROW_COUNT" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Strip polygon_geojson from CSV
        if: steps.filter.outputs.run == 'true' && github.event.inputs.dry_run != 'true'
        run: |
          CSV_FILE="data/raw/parcels_${{ matrix.county }}.csv"
          if [ ! -f "$CSV_FILE" ]; then exit 0; fi
          python3 - <<'PYEOF'
          import csv, os, sys
          county = "${{ matrix.county }}"
          src = f"data/raw/parcels_{county}.csv"
          tmp = f"data/raw/parcels_{county}.tmp.csv"
          with open(src, newline="", encoding="utf-8") as fin, \
               open(tmp, "w", newline="", encoding="utf-8") as fout:
              reader = csv.DictReader(fin)
              fields = [f for f in reader.fieldnames if f != "polygon_geojson"]
              writer = csv.DictWriter(fout, fieldnames=fields, extrasaction="ignore")
              writer.writeheader()
              for row in reader:
                  writer.writerow(row)
          os.replace(tmp, src)
          size_mb = os.path.getsize(src) / 1_048_576
          print(f"Stripped polygon_geojson from {src} → {size_mb:.1f} MB", flush=True)
          PYEOF

      - name: Commit CSV output
        if: steps.filter.outputs.run == 'true' && github.event.inputs.dry_run != 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "data/raw/parcels_${{ matrix.county }}.csv" 2>/dev/null || true
          git add "data/cache/lir/${{ matrix.county }}/" 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "feat(13b-2): scrape ${{ matrix.county }} parcels ($(date -u +%Y-%m-%d))"
            for i in 1 2 3; do
              git pull --rebase origin "${{ github.ref_name }}" && git push && break
              echo "Push attempt $i failed, retrying in $((i * 5))s..."
              sleep $((i * 5))
            done
          fi

      - name: Write cron heartbeat
        if: steps.filter.outputs.run == 'true' && always()
        run: |
          STATUS="${{ job.status }}"
          [ "$STATUS" = "success" ] || STATUS="failure"
          ITEMS="${{ steps.scrape.outputs.row_count }}"
          bash scripts/write_cron_heartbeat.sh \
            "scrape_ugrc_lir_${{ matrix.county }}" \
            "$STATUS" \
            "${ITEMS:-}" \
            "county=${{ matrix.county }} dry_run=${{ github.event.inputs.dry_run }}"
          git config user.name  "github-actions[bot]" 2>/dev/null || true
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com" 2>/dev/null || true
          git add "data/cron_status/" 2>/dev/null || true
          if ! git diff --staged --quiet; then
            git commit -m "chore: heartbeat scrape_ugrc_lir_${{ matrix.county }} $STATUS"
            for i in 1 2 3; do
              git pull --rebase origin "${{ github.ref_name }}" && git push && break
              sleep $((i * 3))
            done
          fi
