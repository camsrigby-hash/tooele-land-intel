name: Scrape UGRC LIR parcels (Phase 13b-2)

on:
  workflow_dispatch:
    inputs:
      county:
        description: "County to scrape (tooele|salt_lake|utah|davis|weber|wasatch|box_elder|all)"
        required: false
        default: "all"
      dry_run:
        description: "Dry run (probe endpoint + count only, no write)"
        required: false
        default: "false"

permissions:
  contents: write

jobs:
  scrape:
    name: "Scrape ${{ matrix.county }}"
    strategy:
      fail-fast: false
      matrix:
        county: [tooele, salt_lake, utah, davis, weber, wasatch, box_elder]
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Check county filter
        id: filter
        run: |
          INPUT="${{ github.event.inputs.county }}"
          COUNTY="${{ matrix.county }}"
          if [ "$INPUT" = "all" ] || [ "$INPUT" = "$COUNTY" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Skipping $COUNTY (input county: $INPUT)"
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.filter.outputs.run == 'true'

      - name: Set up Python
        if: steps.filter.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        if: steps.filter.outputs.run == 'true'
        run: pip install -r requirements.txt

      - name: Scrape ${{ matrix.county }}
        if: steps.filter.outputs.run == 'true'
        id: scrape
        run: |
          ARGS="--county ${{ matrix.county }}"
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          python scripts/scrape_ugrc_lir.py $ARGS
          if [ "${{ github.event.inputs.dry_run }}" != "true" ]; then
            CSV_FILE="data/raw/parcels_${{ matrix.county }}.csv"
            if [ -f "$CSV_FILE" ]; then
              ROW_COUNT=$(( $(wc -l < "$CSV_FILE") - 1 ))
              echo "row_count=$ROW_COUNT" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Commit CSV output
        if: steps.filter.outputs.run == 'true' && github.event.inputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Store CSVs: plain if <90MB, gzipped if 90-99MB, release asset if >=100MB compressed
          CSV_FILE="data/raw/parcels_${{ matrix.county }}.csv"
          if [ -f "$CSV_FILE" ]; then
            SIZE_MB=$(( $(stat -c%s "$CSV_FILE") / 1048576 ))
            if [ "$SIZE_MB" -ge 90 ]; then
              echo "CSV is ${SIZE_MB}MB, compressing..."
              gzip -9 "$CSV_FILE"
              GZ_SIZE_MB=$(( $(stat -c%s "${CSV_FILE}.gz") / 1048576 ))
              if [ "$GZ_SIZE_MB" -ge 90 ]; then
                echo "Compressed CSV is ${GZ_SIZE_MB}MB — uploading to GitHub release (too large for git)..."
                gh release create "large-parcels" --title "Large county parcel CSVs" --notes "Auto-managed by scrape workflow" 2>/dev/null || true
                gh release upload "large-parcels" "${CSV_FILE}.gz" --clobber
                rm "${CSV_FILE}.gz"
                echo "Uploaded parcels_${{ matrix.county }}.csv.gz to large-parcels release"
              else
                git rm --cached "$CSV_FILE" 2>/dev/null || true
                git add "${CSV_FILE}.gz" 2>/dev/null || true
              fi
            else
              git add "$CSV_FILE" 2>/dev/null || true
            fi
          fi
          git add "data/cache/lir/${{ matrix.county }}/" 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "feat(13b-2): scrape ${{ matrix.county }} parcels ($(date -u +%Y-%m-%d))"
            PUSHED=false
            for i in 1 2 3; do
              if git pull --rebase origin "${{ github.ref_name }}" && git push; then
                PUSHED=true
                break
              fi
              echo "Push attempt $i failed, retrying in $((i * 5))s..."
              sleep $((i * 5))
            done
            if [ "$PUSHED" = "false" ]; then
              echo "ERROR: all push attempts failed for ${{ matrix.county }}"
              exit 1
            fi
          fi

      - name: Write cron heartbeat
        if: steps.filter.outputs.run == 'true' && always()
        run: |
          STATUS="${{ job.status }}"
          [ "$STATUS" = "success" ] || STATUS="failure"
          ITEMS="${{ steps.scrape.outputs.row_count }}"
          bash scripts/write_cron_heartbeat.sh \
            "scrape_ugrc_lir_${{ matrix.county }}" \
            "$STATUS" \
            "${ITEMS:-}" \
            "county=${{ matrix.county }} dry_run=${{ github.event.inputs.dry_run }}"
          git config user.name  "github-actions[bot]" 2>/dev/null || true
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com" 2>/dev/null || true
          git add "data/cron_status/" 2>/dev/null || true
          if ! git diff --staged --quiet; then
            git commit -m "chore: heartbeat scrape_ugrc_lir_${{ matrix.county }} $STATUS"
            for i in 1 2 3; do
              git pull --rebase origin "${{ github.ref_name }}" && git push && break
              sleep $((i * 3))
            done
          fi
