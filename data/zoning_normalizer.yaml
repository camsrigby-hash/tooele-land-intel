# Phase 13b-5 zoning normalizer for Wasatch Intel parcel scoring.
#
# Primary mappings are keyed by raw machine-readable zone strings when a parcel
# CSV contains a zone_class / zoning / zone_code-style column. Scores measure
# generic commercial fit, not entitlement certainty:
#   1.0 = pure commercial zoning (B, C, GC, retail-permitted)
#   0.7 = mixed-use with a commercial component (MU, MU-CN, TOD)
#   0.4 = light industrial / flex (M-1, LI, BP)
#   0.2 = high-density residential (R-M, R-3, MF)
#   0.0 = single-family residential, agricultural, conservation, open space
#
# The current checked-in UGRC LIR parcel CSVs in this repository do not include
# a zone_class-like column. score_parcel_zoning.py therefore supports the
# property_class_fallback mappings below so the workflow can produce a current
# file while preserving source_zone_string and normalized_class transparency.
version: phase-13b-5
score_field: zoning_score
primary_source_columns:
  - zone_class
  - zoning_class
  - zoning
  - zone
  - zone_code
  - zonecode
  - zoning_code
  - current_zone
  - land_use_zone
  - landuse_zone
  - base_zone
