# data/zoning/gp_taxonomy.yaml
# Phase 18b-2e — Taxonomy harmonization authority file
#
# One source of truth for per-jurisdiction zone code normalization.
# Read by wasatch-intel/scripts/load_zoning_to_d1.py to produce:
#   zone_current_normalized  — human-readable current zoning class in D1
#   zone_future_normalized   — human-readable future land use class in D1
#
# current_zoning: overrides for zone_code values that map to Other/Unknown
#   in the GeoJSON's zone_class_normalized field (set during 18b-1 extraction).
#   Only codes NOT already covered by the existing field need entries here.
#   Loader logic: use GeoJSON zone_class_normalized when non-null and != "Other/Unknown";
#   look up here for the gaps.
#
# future_zoning: full normalization for all gp_zone_code values in future GP GeoJSONs
#   (most future GeoJSONs have no gp_zone_normalized field set at extraction time).
#
# Standard normalized class vocabulary:
#   Commercial-General       — broad commercial, retail, service
#   Commercial-Neighborhood  — small-scale neighborhood commercial
#   Commercial-Office        — office / professional service
#   Commercial-Recreation    — commercial recreation (golf, resort, etc.)
#   Mixed-Use                — residential + commercial mixed
#   Planned/Mixed-Use        — planned communities, master planned areas
#   Residential-Low          — low density SFR (>10k sqft lots)
#   Residential-Medium       — medium density SFR (<10k) or townhome adjacent
#   Residential-High         — high density / multifamily
#   Residential-Townhome     — attached townhome / rowhouse districts
#   Agriculture/Rural        — agricultural, rural residential, open ranch
#   Industrial/Flex          — light industrial, business park, flex warehouse
#   Public/Institutional     — schools, parks, civic, government, utilities
#   Open Space/Public        — natural open space, greenway, conservation
#   Other/Unknown            — cannot be determined from code alone

version: "14c-data-fix"

# ── Current zoning gap-fills ──────────────────────────────────────────────────
current_zoning:

  # Lehi: 12 codes from 18b-1 (services9 endpoint) + 5 new codes from 18b-2e (services5 endpoint)
  # 18b-1 source: services9.arcgis.com/Lehi_City_Zoning (514 features)
  # 18b-2e source: services5.arcgis.com/Lehi_Zoning (585 features, updated April 2026)
  lehi:
    TH-5:    Residential-Townhome   # Townhome/attached residential district
    PF:      Public/Institutional   # Public facilities (schools, civic)
    A-1:     Agriculture/Rural      # Agricultural (variant of A-5)
    C:       Commercial-General     # General commercial
    PC:      Planned/Mixed-Use      # Planned Community
    NC:      Commercial-Neighborhood # Neighborhood commercial
    BP:      Industrial/Flex        # Business park
    C-H:     Commercial-General     # Highway commercial (variant of CH/HC)
    CR:      Commercial-Recreation  # Commercial recreation
    H/I:     Industrial/Flex        # Heavy/Industrial (slash variant of H-I)
    C-I:     Industrial/Flex        # Commercial-industrial
    T-M:     Industrial/Flex        # Technology-manufacturing
    # 18b-2e additions — new codes found in services5 April 2026 upload
    R-1-22:  Residential-Low        # Single-family, 22k sqft min lot
    "R-1-Flex": Residential-Low     # Flexible SFR district
    R-2:     Residential-Medium     # Two-family residential
    R-2.5:   Residential-Medium     # Two-family variant
    RA-1:    Agriculture/Rural      # Rural agricultural, 1-acre min

  # Grantsville: 8 mappable codes (UNKNOWN left as-is)
  # Fixes: 47.4% → ~5% Other/Unknown (9/19 → 1/19 remaining UNKNOWN)
  grantsville:
    CG:    Commercial-General     # Commercial General
    CN:    Commercial-Neighborhood # Commercial Neighborhood
    CS:    Commercial-General     # Commercial Shopping / Specialty
    CD:    Commercial-General     # Commercial District
    MD:    Residential-Medium     # Medium Density residential
    MG:    Residential-Medium     # Medium General (residential)
    MG-EX: Residential-Medium     # Medium General Extension
    PUD:   Planned/Mixed-Use      # Planned Unit Development
    RM-15: Residential-Medium     # Residential Multi, 15k sq ft min (107 parcels wrong → Industrial/Flex)

  # Spanish Fork: 9 codes
  # Fixes: 36.9% → ~0.5% Other/Unknown (75/203 → 1/203)
  spanish_fork:
    P-F:   Public/Institutional   # Public Facilities (dash variant of PF)
    C-O:   Commercial-Office      # Commercial Office
    C-2:   Commercial-General     # Commercial type 2
    S-C:   Commercial-General     # Shopping Center (dash variant of SC)
    A-E:   Agriculture/Rural      # Agricultural Estate
    BP:    Industrial/Flex        # Business Park
    C-1:   Commercial-General     # Commercial type 1
    C-D:   Commercial-General     # Commercial District
    UV-C:  Commercial-General     # Urban Village Commercial

  # Saratoga Springs: 1 code, 58 features
  # Fixes: 15.8% → 0% Other/Unknown (58/368)
  saratoga_springs:
    PC:    Planned/Mixed-Use      # Planned Community

  # Eagle Mountain:
  #   18b-1 source: services1/General_Zoning_view (1392 zone polygons, Title 17 codes)
  #   18b-2e source: services1/EMC_Zoning_View (22,184 parcel-level, General_Zoning coded domain)
  # The 17.xx codes below are LEGACY (18b-1 zone-polygon layer, now superseded).
  # The General_Zoning label entries below are CURRENT (18b-2e parcel-level layer).
  eagle_mountain:
    # Legacy 17.xx ordinance section codes (18b-1 zone-polygon layer, superseded)
    "17.20": Agriculture/Rural    # Chapter 17.20 Agricultural Zone (~97% consensus)
    "17.23": Open Space/Public    # Chapter 17.23 Open Space/Conservation (~91%)
    "17.31": Open Space/Public    # Chapter 17.31 Open Space (~67%)
    "17.35": Commercial-General   # Chapter 17.35 Commercial (100%)
    "17.37": Open Space/Public    # Chapter 17.37 Open Space (100%)
    "17.38": Commercial-General   # Chapter 17.38 Commercial (~88%)
    "17.40": Industrial/Flex      # Chapter 17.40 Industrial (~82%)
    "17.25": Other/Unknown        # ~46% Residential-Low, ~35% Other/Unknown, 19% mixed
    "17":    Other/Unknown        # Generic chapter reference; ambiguous
    # 18b-2e General_Zoning coded-domain labels (parcel-level, EMC_Zoning_View)
    "Residential":              Residential-Low     # EM is predominantly SFR; conservative default
    "Agriculture":              Agriculture/Rural
    "Open Space":               Open Space/Public
    "Commercial":               Commercial-General
    "Business Park / Industrial":   Industrial/Flex
    "Business Park / Light Industry": Industrial/Flex
    "Under Review":             Other/Unknown       # zoning amendment in progress
    "Other":                    Other/Unknown


  # Herriman: Phase 14c audit — ArcGIS REST zone_class_normalized was wrong for these codes.
  # 6,444 parcels corrected (4,671 R-2-10 + 837 R-1-21 + 934 R-20-43 + 2 C-2).
  # R-20-43 confirmed Multifamily via May 2024 Panorama DA (~5.2 du/ac = Medium band).
  herriman:
    R-2-10:  Residential-Low      # 2-family, 10k sq ft min; suburban SFR-dominant, ~2-3 du/ac
    R-1-21:  Residential-Low      # Single-family, 21k sq ft (~0.5 ac) min lot
    R-20-43: Residential-Medium   # Multifamily zone, confirmed ~5 du/ac; in Herriman GP 4.6-8 du/ac band
    C-2:     Commercial-General   # Standard commercial zone; ArcGIS incorrectly returned Agriculture/Rural

  # Bluffdale: Phase 14c audit — ArcGIS REST wrong for multiple residential codes.
  # 3,111 parcels corrected across 8 codes.
  bluffdale:
    R-1-43:   Residential-Low     # Single-family, 43k sq ft (~1 ac) min lot
    "R-1-43 (Cluster Residential Overlay)": Residential-Low   # Cluster variant, still SFR
    R-1-10:   Residential-Low     # Single-family, 10k sq ft min lot
    R-2-10:   Residential-Low     # 2-family, 10k sq ft min lot
    R-1-87:   Residential-Low     # Single-family, 87k sq ft (~2 ac) min lot; large-lot suburban
    "R-MF Multifamily": Residential-High   # Multifamily residential district
    "I-1 Light Industry": Industrial/Flex  # Light industrial; ArcGIS wrongly returned Commercial
    "R-SL Residential": Residential-Low   # Shoreline residential district
    "I-O Infill Overlay": Other/Unknown   # Infill overlay; use-neutral, cannot normalize standalone

  # Vineyard: Phase 14c audit — R-2-15 wrongly normalized as Mixed-Use.
  # 82 parcels corrected. Vineyard is a denser new-city context; R-2 + 15k sq ft ~ Residential-Medium.
  vineyard:
    R-2-15: Residential-Medium    # 2-family, 15k sq ft min; Vineyard density context ~5 du/ac

  # South Jordan: Phase 14c audit — R-M* (Residential Multifamily) wrongly normalized as Mixed-Use.
  # 3,099 parcels corrected. Confirmed: SJ city council minutes 2025-05-06 explicitly call R-M
  # "residential multifamily." Numerical suffix = approved units per acre (per Sterling Codifiers).
  south_jordan:
    R-M:          Residential-High    # Base multifamily zone, no density ceiling set
    "R-M (PD)":   Residential-High    # Base R-M with Planned Development overlay
    R-M-4:        Residential-Medium  # 4 du/ac multifamily
    R-M-5:        Residential-Medium  # 5 du/ac multifamily
    "R-M-5 (PD)": Residential-Medium  # 5 du/ac + Planned Development overlay
    R-M-6:        Residential-Medium  # 6 du/ac multifamily
    R-M-7:        Residential-Medium  # 7 du/ac multifamily
    R-M-8:        Residential-Medium  # 8 du/ac multifamily


